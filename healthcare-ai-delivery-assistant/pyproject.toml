[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "healthcare-ai-delivery-assistant"
version = "0.1.0"
description = "Evidence-grounded healthcare literature assistant and AI delivery portfolio"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
app = ["streamlit>=1.36", "pypdf>=4.0", "anthropic>=0.34"]
mcp = ["mcp>=1.9"]
dev = ["pytest>=8.0", "ruff>=0.6"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
